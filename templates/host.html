<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Wars - Host</title>
</head>
<body>
    <h1>Host a new game</h1>
    <form method="POST" action="/host">
        <label>
            Time per question (seconds)
            <input type="number" name="answer_timeout_seconds" min="10" max="300" step="1" value="60">
        </label>
        <br>
        <label>
            Time per voting round (seconds)
            <input type="number" name="vote_timeout_seconds" min="5" max="120" step="1" value="30">
        </label>
        <br>
        <label>
            <input type="checkbox" name="shuffle_questions">
            Shuffle questions
        </label>
        <br>
        <select name="question_set">
            <option value="" disabled selected>Select a question set</option>
            {% for set in question_sets %}
                <option value="{{ set.id }}">{{ set.displayName }}</option>
            {% endfor %}
        </select>
        <button>create game</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Wars – Host</title>
</head>
<body onload="checkGameStatus()">
    <div id="waiting-room">
        <div class="title">
            <h1>[QUIZ WARS LOGO HERE]</h1>
        </div>
        <div class="ui">
            <button onclick="startGame()">Start Game</button>
            <h1>Join at QUIZWARS.COM</h1>
            <h1>{{ game_id }}</h1>
            <div id="players"></div>
        </div>
    </div>
    <div id="game-ui">
        <div id="bossbars">
            <div id="avatar-health">
                <div class="avatar-bossbar">
                    <h1>Wizard</h1>
                    <input type="range" value="100" max="100" class="boss-range" disabled>
                </div>
                <div class="avatar-bossbar">
                    <h1>Knight</h1>
                    <input type="range" value="100" max="100" class="boss-range" disabled>
                </div>
                <div class="avatar-bossbar">
                    <h1>Monk</h1>
                    <input type="range" value="100" max="100" class="boss-range" disabled>
                </div>
            </div>
            <div id="boss-health">
                <h1>Jonah</h1>
                <input type="range" id="boss-health-bar" value="100" max="100" class="boss-range" disabled>
            </div>
        </div>
        <div id="game-stage">
            <div id="avatar-row">
                <div class="avatar-slot">
                    <img class="avatar-image" alt="Wizard avatar" src="/static/wizard.png">
                    <div class="avatar-label">Wizard</div>
                </div>
                <div class="avatar-slot">
                    <img class="avatar-image" alt="Knight avatar" src="/static/knight.png">
                    <div class="avatar-label">Knight</div>
                </div>
                <div class="avatar-slot">
                    <img class="avatar-image" alt="Monk avatar" src="/static/monk.png">
                    <div class="avatar-label">Monk</div>
                </div>
            </div>
            <div id="boss-area">
                <img class="boss-image" alt="Boss" src="/static/boss.png">
                <div class="boss-label">JONAH</div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    window.gameStatus = "lobby";

    function tick() {
        if (window.gameStatus == "lobby") {
            getPlayersInLobby();
        }

        if (window.gameStatus == "starting") {
            renderGameState();
        }
    }

    setInterval(() => {
        tick();
    }, 500);

    function getPlayersInLobby() {
        fetch('/game/get-players/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                const playersDiv = document.getElementById('players');
                playersDiv.innerHTML = ''; // Clear existing player boxes
                data.forEach(player => {
                    if (player.player_status == "kicked") {
                        return; // Skip rendering kicked players
                    }

                    const playerBox = document.createElement('div');
                    playerBox.className = 'player-box';
                    playerBox.innerHTML = `<p>${player.name}</p>`;
                    playerBox.onclick = () => {
                        let confirmation = confirm(`Kick ${player.name} from the lobby?`);
                        if (confirmation) {
                            fetch(`/game/kick-player/{{ game_id }}/${player.id}`)
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error('Network response was not ok');
                                    }
                                    getPlayersInLobby(); // Refresh the player list after kicking
                                })
                                .catch(error => console.error('Error kicking player:', error));
                        }
                    };
                    playersDiv.appendChild(playerBox);
                });
            })
            .catch(error => console.error('Error fetching players:', error));
    }

    function startGame() {
        getPlayersInLobby(); // Final refresh to ensure we have the latest player list before starting
        window.gameStatus = "starting";

        fetch("/game/start/{{ game_id }}")
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                document.getElementById('waiting-room').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
            })
            .catch(error => {
                console.error('Error starting game:', error);
                alert("Failed to start the game. Please try again.");
            });
    }

    function checkGameStatus() {
        fetch('/game/state/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                if (data.game_status == "starting") {
                    window.gameStatus = "starting";
                    document.getElementById('waiting-room').style.display = 'none';
                    document.getElementById('game-ui').style.display = 'block';
                }
            })
            .catch(error => console.error('Error checking game status:', error));
    }

    function renderGameState() {
        fetch('/game/state/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                if (data.game_status == "starting") {
                    // Update boss health (if present)
                    const bossHealthBar = document.getElementById('boss-health-bar');
                    if (bossHealthBar && data.boss_health != null) {
                        if (data.boss_health > bossHealthBar.max) bossHealthBar.max = data.boss_health;
                        bossHealthBar.value = data.boss_health;
                        const bossPercent = bossHealthBar.max > 0 ? Math.round((data.boss_health / bossHealthBar.max) * 100) : 0;
                        bossHealthBar.style.setProperty('--hp-percent', bossPercent + '%');
                    }

                    // Update avatar health bars. The server sends `avatars` as an object
                    // keyed by avatar name (e.g. { "Knight": { hp: 40, name: "Knight" }, ... }).
                    const avatars = data.avatars;
                    const bars = Array.from(document.querySelectorAll('.avatar-bossbar'));

                        function updateBarByName(name, hp) {
                        if (!name) return;
                        const match = bars.find(div => {
                            const h = div.querySelector('h1');
                            return h && h.textContent.trim().toLowerCase() === name.trim().toLowerCase();
                        });
                        if (!match) return;
                        const input = match.querySelector('input[type="range"]');
                        if (input && typeof hp === 'number') {
                            if (hp > input.max) input.max = Math.max(hp, input.max || 100);
                            input.value = hp;
                                const percent = input.max > 0 ? Math.round((hp / input.max) * 100) : 0;
                                input.style.setProperty('--hp-percent', percent + '%');
                        }
                        // show numeric hp next to the name
                        let hpSpan = match.querySelector('.hp-value');
                        if (!hpSpan) {
                            hpSpan = document.createElement('span');
                            hpSpan.className = 'hp-value';
                            hpSpan.style.marginLeft = '8px';
                            const h = match.querySelector('h1');
                            if (h) h.after(hpSpan);
                        }
                        hpSpan.textContent = typeof hp === 'number' ? hp : '';
                    }

                    if (avatars) {
                        if (Array.isArray(avatars)) {
                            avatars.forEach(av => updateBarByName(av.name || av.player || '', av.hp || av.health));
                        } else {
                            Object.keys(avatars).forEach(key => {
                                const av = avatars[key] || {};
                                updateBarByName(av.name || key, av.hp || av.health);
                            });
                        }
                    }
                }
            })
            .catch(error => console.error('Error fetching game state:', error));
    }
</script>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: monospace;
        background-color: #f0f0f0;

        image-rendering: pixelated;
    }
    #waiting-room {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }
    .title {
        display: flex;
        justify-content: center;
        width: 80%;
        margin-bottom: 50px;
    }
    .title h1 {
        margin: 0;
    }
    .ui {
        text-align: center;
        font-size: 1.5rem;
    }
    #players {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    .player-box {
        background-color: white;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 5px 10px;
        min-width: 120px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }


    /* GAME UI STYLES */
    #game-ui {
        display: none;
        padding: 20px;
    }
    #bossbars {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        min-height: 25vh;
        box-sizing: border-box;
    }
    #avatar-health {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
        padding: 16px;
        border: 2px solid #333;
        border-radius: 2px;
        background-color: white;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    .avatar-bossbar {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        width: 100%;
    }
    .avatar-bossbar h1 {
        margin: 0;
        min-width: 90px;
        text-align: left;
    }
    .avatar-bossbar input[type="range"] {
        width: 240px;
    }
    .hp-value {
        font-size: 0.9rem;
        color: #222;
        margin-left: 8px;
    }

    /* Bossbar visual styles (non-interactable) */
    input.boss-range {
        -webkit-appearance: none;
        appearance: none;
        pointer-events: none;
        height: 14px;
        border-radius: 8px;
        background: #444;
        width: 80%;
        overflow: hidden;
    }
    input.boss-range::-webkit-slider-runnable-track {
        height: 14px;
        -webkit-appearance: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #e74c3c 0%, #e74c3c var(--hp-percent,100%), #444 var(--hp-percent,100%), #444 100%);
    }
    input.boss-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 0;
        height: 0;
    }
    input.boss-range::-moz-range-track {
        height: 14px;
        border-radius: 8px;
        background: linear-gradient(90deg, #e74c3c 0%, #e74c3c var(--hp-percent,100%), #444 var(--hp-percent,100%), #444 100%);
    }
    input.boss-range::-moz-range-thumb { display: none; }

    /* Boss health with different color */
    #boss-health input.boss-range::-webkit-slider-runnable-track { background: linear-gradient(90deg, #8e44ad 0%, #8e44ad var(--hp-percent,100%), #444 var(--hp-percent,100%), #444 100%); }
    #boss-health input.boss-range::-moz-range-track { background: linear-gradient(90deg, #8e44ad 0%, #8e44ad var(--hp-percent,100%), #444 var(--hp-percent,100%), #444 100%); }
    #boss-health {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
        width: 500px;
        border: 2px solid #333;
        border-radius: 2px;
        background-color: white;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    #game-stage {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        min-height: 60vh;
    }
    #avatar-row {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        padding-left: 8px;
    }
    .avatar-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }
    .avatar-image {
        width: 270px;
        height: 270px;
        object-fit: contain;
        display: block;
    }
    #boss-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-right: 24px;
    }
    .boss-image {
        width: 500px;
        height: 400px;
        object-fit: cover;
        display: block;
    }
    .avatar-label,
    .boss-label {
        font-size: 1.2rem;
    }
</style>

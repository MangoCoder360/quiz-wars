<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Wars – Host</title>
</head>
<body onload="checkGameStatus()">
    <div id="waiting-room">
        <div class="title">
            <img src="/static/quizWarsTitle.png" alt="Quiz Wars" style="max-width: 100%; height: auto; display: block;">
        </div>
        <div class="ui">
            <button onclick="startGame()">Start Game</button>
            <h1>Join at QUIZWARS.COM</h1>
            <h1>{{ game_id }}</h1>
            <div id="players"></div>
        </div>
    </div>
    <div id="game-ui">
        <div id="bossbars">
            <div id="avatar-health">
                <div class="avatar-bossbar">
                    <div class="avatar-meta">
                        <h1>Wizard</h1>
                        <div class="avatar-status" data-avatar-status="Wizard">No status</div>
                    </div>
                    <input type="range" value="25" max="25" class="boss-range" disabled>
                </div>
                <div class="avatar-bossbar">
                    <div class="avatar-meta">
                        <h1>Knight</h1>
                        <div class="avatar-status" data-avatar-status="Knight">No status</div>
                    </div>
                    <input type="range" value="40" max="40" class="boss-range" disabled>
                </div>
                <div class="avatar-bossbar">
                    <div class="avatar-meta">
                        <h1>Monk</h1>
                        <div class="avatar-status" data-avatar-status="Monk">No status</div>
                    </div>
                    <input type="range" value="35" max="35" class="boss-range" disabled>
                </div>
            </div>
            <div id="phase-indicator">
                <div id="phase-label">ANSWER PHASE</div>
                <div id="phase-timer">60s</div>
            </div>
            <div id="boss-health">
                <h1>Jonah</h1>
                <input type="range" id="boss-health-bar" value="300" max="300" class="boss-range" disabled>
                <div id="boss-health-value">300 / 300</div>
            </div>
        </div>
        <div id="game-stage">
            <div id="avatar-row">
                <div class="avatar-slot" data-avatar-name="Wizard">
                    <img class="avatar-image" alt="Wizard avatar" src="/static/wizard.png">
                    <div class="avatar-label">Wizard</div>
                </div>
                <div class="avatar-slot" data-avatar-name="Knight">
                    <img class="avatar-image" alt="Knight avatar" src="/static/knight.png">
                    <div class="avatar-label">Knight</div>
                </div>
                <div class="avatar-slot" data-avatar-name="Monk">
                    <img class="avatar-image" alt="Monk avatar" src="/static/monk.png">
                    <div class="avatar-label">Monk</div>
                </div>
            </div>
            <div id="boss-area" data-boss-name="Jonah">
                <img class="boss-image" alt="Boss" src="/static/boss.png">
                <div class="boss-label">JONAH</div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    window.gameStatus = "lobby";
    window.lastRoundSignature = null;

    const quizWarsAnimationDefaults = Object.freeze({
        attack: 560,
        hit: 420,
        jump: 720,
    });

    const quizWarsAnimationTimers = new WeakMap();

    function normalizeQuizWarsName(value) {
        return String(value ?? "").trim().toLowerCase();
    }

    function getQuizWarsAvatarSlot(name) {
        const normalizedName = normalizeQuizWarsName(name);
        if (!normalizedName) return null;

        return Array.from(document.querySelectorAll('.avatar-slot')).find(slot => {
            const slotName = slot.dataset.avatarName || slot.querySelector('.avatar-label')?.textContent || '';
            return normalizeQuizWarsName(slotName) === normalizedName;
        }) || null;
    }

    function getQuizWarsBossArea() {
        return document.getElementById('boss-area');
    }

    function getQuizWarsAvatarImage(name) {
        const slot = getQuizWarsAvatarSlot(name);
        return slot ? slot.querySelector('.avatar-image') : null;
    }

    function getQuizWarsBossImage() {
        const bossArea = getQuizWarsBossArea();
        return bossArea ? bossArea.querySelector('.boss-image') : null;
    }

    function resolveQuizWarsTarget(target) {
        if (!target) return null;

        if (target instanceof HTMLElement) {
            return target.closest('.avatar-slot, #boss-area') || target;
        }

        if (typeof target === 'string') {
            const normalizedTarget = normalizeQuizWarsName(target);
            if (normalizedTarget === 'boss' || normalizedTarget === 'jonah') {
                return getQuizWarsBossArea();
            }

            return getQuizWarsAvatarSlot(target);
        }

        if (typeof target === 'object') {
            if (target.type === 'boss') {
                return getQuizWarsBossArea();
            }

            if (target.type === 'avatar' && target.name) {
                return getQuizWarsAvatarSlot(target.name);
            }
        }

        return null;
    }

    function restartQuizWarsAnimation(element, className) {
        if (!element) return false;

        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
        return true;
    }

    function playQuizWarsAnimation(target, action, options = {}) {
        const element = resolveQuizWarsTarget(target);
        if (!element) return false;

        const normalizedAction = normalizeQuizWarsName(action);
        const animationClass = `qw-${normalizedAction}`;
        const duration = Number(options.duration ?? quizWarsAnimationDefaults[normalizedAction] ?? 600);

        restartQuizWarsAnimation(element, animationClass);

        const existingTimer = quizWarsAnimationTimers.get(element);
        if (existingTimer) {
            window.clearTimeout(existingTimer);
        }

        const timer = window.setTimeout(() => {
            element.classList.remove(animationClass);
            quizWarsAnimationTimers.delete(element);
        }, Number.isFinite(duration) && duration > 0 ? duration : 600);
        quizWarsAnimationTimers.set(element, timer);
        return true;
    }

    function bootstrapQuizWarsAnimations() {
        Array.from(document.querySelectorAll('.avatar-image')).forEach(image => image.classList.add('qw-idle'));
        const bossImage = getQuizWarsBossImage();
        if (bossImage) {
            bossImage.classList.add('qw-idle');
        }
    }

    const quizWarsAnimations = {
        getAvatarSlot: getQuizWarsAvatarSlot,
        getAvatarImage: getQuizWarsAvatarImage,
        getBossArea: getQuizWarsBossArea,
        getBossImage: getQuizWarsBossImage,
        animate: playQuizWarsAnimation,
        play: playQuizWarsAnimation,
        attack(target, options = {}) {
            return playQuizWarsAnimation(target, 'attack', options);
        },
        hit(target, options = {}) {
            return playQuizWarsAnimation(target, 'hit', options);
        },
        jump(target, options = {}) {
            return playQuizWarsAnimation(target, 'jump', options);
        },
        attackAvatar(name, options = {}) {
            return playQuizWarsAnimation({ type: 'avatar', name }, 'attack', options);
        },
        hitAvatar(name, options = {}) {
            return playQuizWarsAnimation({ type: 'avatar', name }, 'hit', options);
        },
        jumpAvatar(name, options = {}) {
            return playQuizWarsAnimation({ type: 'avatar', name }, 'jump', options);
        },
        attackBoss(options = {}) {
            return playQuizWarsAnimation({ type: 'boss' }, 'attack', options);
        },
        hitBoss(options = {}) {
            return playQuizWarsAnimation({ type: 'boss' }, 'hit', options);
        },
        jumpBoss(options = {}) {
            return playQuizWarsAnimation({ type: 'boss' }, 'jump', options);
        },
    };

    window.quizWarsAnimations = quizWarsAnimations;
    window.quizWarsStageFX = quizWarsAnimations;
    window.quizWarsStage = quizWarsAnimations;
    window.attackAvatar = quizWarsAnimations.attackAvatar;
    window.hitAvatar = quizWarsAnimations.hitAvatar;
    window.jumpAvatar = quizWarsAnimations.jumpAvatar;
    window.attackBoss = quizWarsAnimations.attackBoss;
    window.hitBoss = quizWarsAnimations.hitBoss;
    window.jumpBoss = quizWarsAnimations.jumpBoss;

    // bootstrapQuizWarsAnimations();

    function tick() {
        if (window.gameStatus == "lobby") {
            getPlayersInLobby();
        }

        if (window.gameStatus == "in-progress") {
            renderGameState();
        }
    }

    setInterval(() => {
        tick();
    }, 500);

    function getPlayersInLobby() {
        fetch('/game/get-players/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                const playersDiv = document.getElementById('players');
                playersDiv.innerHTML = ''; // Clear existing player boxes
                data.forEach(player => {
                    if (player.player_status == "kicked") {
                        return; // Skip rendering kicked players
                    }

                    const playerBox = document.createElement('div');
                    playerBox.className = 'player-box';
                    playerBox.innerHTML = `<p>${player.name}</p>`;
                    playerBox.onclick = () => {
                        let confirmation = confirm(`Kick ${player.name} from the lobby?`);
                        if (confirmation) {
                            fetch(`/game/kick-player/{{ game_id }}/${player.id}`)
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error('Network response was not ok');
                                    }
                                    getPlayersInLobby(); // Refresh the player list after kicking
                                })
                                .catch(error => console.error('Error kicking player:', error));
                        }
                    };
                    playersDiv.appendChild(playerBox);
                });
            })
            .catch(error => console.error('Error fetching players:', error));
    }

    function startGame() {
        getPlayersInLobby(); // Final refresh to ensure we have the latest player list before starting
        window.gameStatus = "in-progress";

        fetch("/game/start/{{ game_id }}")
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                document.getElementById('waiting-room').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
            })
            .catch(error => {
                console.error('Error starting game:', error);
                alert("Failed to start the game. Please try again.");
            });
    }

    function checkGameStatus() {
        fetch('/game/state/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                if (data.game_status == "in-progress") {
                    window.gameStatus = "in-progress";
                    document.getElementById('waiting-room').style.display = 'none';
                    document.getElementById('game-ui').style.display = 'block';
                }
            })
            .catch(error => console.error('Error checking game status:', error));
    }

    function renderGameState() {
        fetch('/game/state/{{ game_id }}')
            .then(response => response.json())
            .then(data => {
                if (data.game_status == "in-progress") {
                    const bossHp = data.boss_state?.hp ?? data.game_state?.boss_hp ?? data.boss_health ?? 300;
                    const bossHealthBar = document.getElementById('boss-health-bar');
                    const bossHealthValue = document.getElementById('boss-health-value');
                    if (bossHealthBar) {
                        bossHealthBar.value = bossHp;
                        bossHealthBar.max = 300;
                        const hpPercent = Math.max(0, Math.min(100, (bossHp / 300) * 100));
                        bossHealthBar.style.setProperty('--hp-percent', `${hpPercent}%`);
                        bossHealthBar.setAttribute('aria-valuenow', String(bossHp));
                        bossHealthBar.setAttribute('aria-valuemax', '300');
                    }
                    if (bossHealthValue) {
                        bossHealthValue.textContent = `${Math.max(0, bossHp)} / 300`;
                    }

                    const updateBarByName = (name, hp, maxHp) => {
                        const match = Array.from(document.querySelectorAll('.avatar-bossbar')).find(div => {
                            const h = div.querySelector('h1');
                            return h && h.textContent.trim().toLowerCase() === String(name).trim().toLowerCase();
                        });
                        if (!match) return;
                        const input = match.querySelector('input[type="range"]');
                        if (input) {
                            input.max = maxHp;
                            input.value = hp;
                        }
                        let hpSpan = match.querySelector('.hp-value');
                        if (!hpSpan) {
                            hpSpan = document.createElement('span');
                            hpSpan.className = 'hp-value';
                            hpSpan.style.marginLeft = '8px';
                            const h = match.querySelector('h1');
                            if (h) h.after(hpSpan);
                        }
                        hpSpan.textContent = `${Math.max(0, hp)} / ${maxHp}`;
                    };

                    const avatarStates = data.avatar_states || {};
                    updateBarByName('Wizard', avatarStates.Wizard?.hp ?? 25, 25);
                    updateBarByName('Knight', avatarStates.Knight?.hp ?? 40, 40);
                    updateBarByName('Monk', avatarStates.Monk?.hp ?? 35, 35);

                    const updateStatusByName = (name, statuses) => {
                        const normalizedStatuses = Array.isArray(statuses) ? statuses.filter(Boolean) : [];
                        const statusClassMap = {
                            Enchanted: 'is-enchanted',
                            Shielded: 'is-shielded',
                            Parrying: 'is-parrying',
                            Frozen: 'is-frozen',
                            Shocked: 'is-shocked',
                            Weakened: 'is-weakened',
                        };
                        const statusEl = document.querySelector(`.avatar-status[data-avatar-status="${String(name).replace(/"/g, '\\"')}"]`);
                        if (statusEl) {
                            statusEl.innerHTML = '';
                            if (normalizedStatuses.length === 0) {
                                const chip = document.createElement('span');
                                chip.className = 'avatar-status-chip is-muted';
                                chip.textContent = 'No status';
                                statusEl.appendChild(chip);
                                return;
                            }

                            normalizedStatuses.forEach(status => {
                                const chip = document.createElement('span');
                                chip.className = `avatar-status-chip ${statusClassMap[status] || ''}`.trim();
                                chip.textContent = status;
                                statusEl.appendChild(chip);
                            });
                        }
                    };

                    updateStatusByName('Wizard', avatarStates.Wizard?.status ?? []);
                    updateStatusByName('Knight', avatarStates.Knight?.status ?? []);
                    updateStatusByName('Monk', avatarStates.Monk?.status ?? []);

                    // Update countdown timer - always try to update even if data missing
                    const currentPhase = data.current_phase || 'answer';
                    const phaseLabel = document.getElementById('phase-label');
                    const phaseTimer = document.getElementById('phase-timer');
                    
                    if (phaseLabel) {
                        phaseLabel.textContent = currentPhase === 'answer' ? 'ANSWER PHASE' : 'VOTE PHASE';
                    }

                    // Always attempt to update timer if we have time data
                    if (phaseTimer && data.server_time != null && data.answer_phase_started_at != null) {
                        let timeRemaining = 0;
                        
                        if (currentPhase === 'answer') {
                            const answerTimeout = data.answer_timeout_seconds || 60;
                            const serverElapsed = data.server_time - data.answer_phase_started_at;
                            timeRemaining = Math.max(0, Math.ceil(answerTimeout - serverElapsed));
                        } else if (currentPhase === 'vote' && data.vote_phase_started_at != null) {
                            const voteTimeout = data.vote_timeout_seconds || 30;
                            const serverElapsed = data.server_time - data.vote_phase_started_at;
                            timeRemaining = Math.max(0, Math.ceil(voteTimeout - serverElapsed));
                        }
                        
                        phaseTimer.textContent = timeRemaining + 's';
                        // Add visual warning when time is running out
                        if (timeRemaining <= 10) {
                            phaseTimer.style.color = '#ff4444';
                            phaseTimer.style.fontWeight = 'bold';
                        } else {
                            phaseTimer.style.color = '#fff';
                            phaseTimer.style.fontWeight = 'bold';
                        }
                    } else {
                        // Missing data - show placeholder
                        if (phaseTimer) {
                            phaseTimer.textContent = '--s';
                            phaseTimer.style.color = '#ccc';
                        }
                    }

                    const signature = JSON.stringify(data.round_results || {});
                    if (data.round_results && signature !== window.lastRoundSignature) {
                        window.lastRoundSignature = signature;
                        const roundLog = data.round_results.actions || [];
                        if (roundLog.length > 0 && window.quizWarsAnimations) {
                            roundLog.forEach(entry => {
                                if (entry.avatar) {
                                    window.quizWarsAnimations.attackAvatar(entry.avatar);
                                }
                            });
                        }
                    }

                    if (data.game_over) {
                        window.gameStatus = "lobby";
                    }
                }
            })
            .catch(error => console.error('Error fetching game state:', error));
    }
</script>

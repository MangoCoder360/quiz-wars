<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Quiz Wars – Debug Options</title>
</head>
<body>
    <h1>Debug Options</h1>
    <button onclick="spamPlayerJoins()">Spam Player Joins</button>
</body>
</html>
<script>
    function spamPlayerJoins() {
        var gameId = prompt("Enter the game ID to spam joins to:");
        for (let i = 0; i < 10; i++) {
            const data = new URLSearchParams();
            data.append('player_name', `Player${i + 1}`);
            data.append('game_id', String(gameId));

            fetch('/join-game', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: data.toString(),
                credentials: 'same-origin'
            }).catch((err) => {
                console.error('Failed to send join request', err);
            });
        }
    }
</script>

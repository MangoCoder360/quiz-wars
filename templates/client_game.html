<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Wars – In-game</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        {% raw %}
        :root {
            --parchment: #f7efe0;
            --parchment-2: #f3e5c8;
            --accent: #6b4423;
            --accent-2: #8b5a2b;
            --text: #231f20;
            --good: #2f7d32;
            --bad: #9c2f2f;
            --panel: rgba(255, 249, 236, 0.96);
        }
        body {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            background: radial-gradient(circle at top, #fff8eb 0, #f2e3c4 42%, #dcc79f 100%);
            color: var(--text);
        }
        #game-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .panel {
            background: var(--panel);
            border: 4px solid rgba(107, 68, 35, 0.18);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-radius: 18px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .panel-header {
            padding: 14px 18px;
            background: linear-gradient(180deg, #f8eed9, #f2dfb8);
            border-bottom: 1px solid rgba(107, 68, 35, 0.14);
            font-family: 'Cinzel', serif;
            color: var(--accent-2);
        }
        .panel-body {
            padding: 18px;
        }
        #status-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .status-pill {
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(107, 68, 35, 0.08);
            color: var(--accent);
            font-weight: 700;
        }
        #question-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            line-height: 1.2;
            text-align: center;
            margin: 0 0 16px;
            color: var(--accent-2);
        }
        #question-meta,
        #game-over {
            text-align: center;
            font-size: 18px;
            margin-bottom: 12px;
        }
        #round-stage {
            padding: 6px 0 2px;
        }
        #round-results-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            line-height: 1.2;
            text-align: center;
            margin: 0 0 8px;
            color: var(--accent-2);
        }
        #round-results-subtitle {
            text-align: center;
            font-size: 18px;
            margin: 0 0 16px;
            color: #5f4a32;
        }
        #round-summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .round-summary-card {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(107, 68, 35, 0.12);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }
        .round-summary-card.is-boss {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, rgba(255, 250, 240, 0.92), rgba(246, 232, 206, 0.96));
        }
        .round-summary-icon {
            width: 84px;
            height: 84px;
            flex: 0 0 84px;
            border-radius: 14px;
            object-fit: contain;
            object-position: center bottom;
            background: linear-gradient(180deg, #f8efd9, #efdfbe);
            border: 2px solid rgba(107, 68, 35, 0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
            padding: 4px;
            box-sizing: border-box;
        }
        .round-summary-body {
            flex: 1;
            min-width: 0;
        }
        .round-summary-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .round-summary-name {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--accent-2);
        }
        .round-summary-hp {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
        }
        .round-summary-line {
            font-size: 18px;
            line-height: 1.35;
            color: var(--text);
            margin-bottom: 4px;
        }
        .round-summary-line.muted {
            color: #6f5c43;
        }
        .round-summary-votes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .round-summary-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 14px;
            line-height: 1.2;
            background: rgba(107, 68, 35, 0.08);
            color: var(--accent);
            border: 1px solid rgba(107, 68, 35, 0.12);
        }
        .round-summary-chip.good {
            background: rgba(47, 125, 50, 0.12);
            color: var(--good);
        }
        .round-summary-chip.bad {
            background: rgba(156, 47, 47, 0.12);
            color: var(--bad);
        }
        .round-summary-chip.neutral {
            background: rgba(107, 68, 35, 0.08);
            color: var(--accent);
        }
        #answer-grid,
        #vote-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tile-button {
            appearance: none;
            border: 3px solid rgba(107, 68, 35, 0.12);
            background: linear-gradient(180deg, #fffaf0, #f3ead6);
            color: var(--accent);
            min-height: 92px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            padding: 16px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
        }
        .vote-action-name {
            font-size: 24px;
            line-height: 1.05;
            color: var(--accent-2);
        }
        .vote-action-desc {
            font-size: 16px;
            line-height: 1.2;
            color: #5f4a32;
            font-weight: 600;
        }
        .vote-action-note {
            font-size: 14px;
            line-height: 1.2;
            color: #9c2f2f;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .tile-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
        }
        .tile-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .tile-button[title*="cooling"] {
            background: linear-gradient(180deg, #f5e0d6, #e8cebf);
            border-color: rgba(156, 47, 47, 0.2);
        }
        #game-message {
            margin-top: 12px;
            text-align: center;
            font-size: 18px;
            min-height: 24px;
        }
        #game-message.good { color: var(--good); }
        #game-message.bad { color: var(--bad); }
        #health-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .health-card {
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid rgba(107, 68, 35, 0.12);
            border-radius: 14px;
            padding: 12px;
        }
        .health-card h3 {
            margin: 0 0 8px;
            font-family: 'Cinzel', serif;
            font-size: 18px;
        }
        .health-bar {
            height: 14px;
            border-radius: 999px;
            background: rgba(107, 68, 35, 0.12);
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            transition: width 0.35s ease;
            background: linear-gradient(90deg, #b53d3d, #5dbb63);
        }
        .health-note {
            margin-top: 6px;
            font-size: 16px;
            min-height: 20px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 760px) {
            #answer-grid,
            #vote-grid,
            #health-summary,
            #round-summary-grid {
                grid-template-columns: 1fr;
            }
        }
        {% endraw %}
    </style>
</head>
<body>
    <div id="game-shell">
        <div id="lobby-view" class="panel">
            <div class="panel-header">Waiting for game start</div>
            <div class="panel-body" style="text-align:center; font-size: 22px;">
                <div id="welcome-name">Welcome to Quiz Wars.</div>
                <div id="welcome-avatar" style="margin-top:8px;">Your avatar will appear here when the game starts.</div>
            </div>
        </div>

        <div id="game-view" class="panel hidden">
            <div class="panel-header">Battle Round</div>
            <div class="panel-body">
                <div id="status-row">
                    <div class="status-pill" id="status-player">Player</div>
                    <div class="status-pill" id="status-avatar">Avatar</div>
                    <div class="status-pill" id="status-round">Round 0</div>
                    <div class="status-pill" id="status-boss">Boss HP: 300</div>
                    <div class="status-pill" id="status-timer">Time: 60s</div>
                </div>

                <div id="question-stage">
                    <h1 id="question-title">Question</h1>
                    <div id="question-meta"></div>
                    <div id="answer-grid"></div>
                    <div id="game-message"></div>
                </div>

                <div id="vote-stage" class="hidden">
                    <h1 id="vote-title" style="font-family:'Cinzel', serif; text-align:center; color:var(--accent-2);">Vote for your avatar action</h1>
                    <div id="vote-grid"></div>
                </div>

                <div id="round-stage" class="hidden">
                    <h1 id="round-results-title">Round resolved</h1>
                    <div id="round-results-subtitle"></div>
                    <div id="round-summary-grid"></div>
                </div>

                <div id="game-over" class="hidden"></div>

                <div id="health-summary">
                    <div class="health-card">
                        <h3>Wizard</h3>
                        <div class="health-bar"><div class="health-fill" id="wizard-hp-fill"></div></div>
                        <div class="health-note" id="wizard-status">25 / 25</div>
                    </div>
                    <div class="health-card">
                        <h3>Knight</h3>
                        <div class="health-bar"><div class="health-fill" id="knight-hp-fill"></div></div>
                        <div class="health-note" id="knight-status">40 / 40</div>
                    </div>
                    <div class="health-card">
                        <h3>Monk</h3>
                        <div class="health-bar"><div class="health-fill" id="monk-hp-fill"></div></div>
                        <div class="health-note" id="monk-status">35 / 35</div>
                    </div>
                    <div class="health-card">
                        <h3>Jonah</h3>
                        <div class="health-bar"><div class="health-fill" id="boss-hp-fill"></div></div>
                        <div class="health-note" id="boss-status">300 / 300</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    const gameId = {{ game_id }};
    const playerId = {{ player_id }};
    const avatarActions = {
        Wizard: ["Fire", "Ice", "Lightning", "Shield"],
        Knight: ["Break", "Cleave", "Parry"],
        Monk: ["Heal", "Enchant", "DoublePunch"],
    };

    const actionDescriptions = {
        Wizard: {
            Fire: 'Heavy single-target spell damage.',
            Ice: 'Freeze the boss so it cannot attack this round.',
            Lightning: 'Deal damage and apply Shocked status.',
            Shield: 'Block the next incoming hit on this avatar.',
        },
        Knight: {
            Break: 'Strong strike with high damage.',
            Cleave: 'Reliable sword attack damage.',
            Parry: 'Prepare to parry and reduce redirected damage.',
        },
        Monk: {
            Heal: 'Heal Monk for 10, heal allies for 5, and revive downed allies to 5.',
            Enchant: 'Buff next attack with bonus damage.',
            DoublePunch: 'Two fast hits for strong total damage.',
        },
    };

    const state = {
        player: null,
        question: null,
        gameState: null,
        assignedAvatar: null,
        answeredCorrectly: false,
        voteSubmitted: false,
        roundHandled: false,
        loadedQuestionIndex: null,
        polling: true,
    };

    function setMessage(text, tone) {
        const message = document.getElementById('game-message');
        message.textContent = text || '';
        message.className = tone || '';
    }

    function getAvatarIconPath(avatarName) {
        const normalizedName = String(avatarName || '').trim().toLowerCase();
        if (normalizedName === 'wizard') return '/static/wizard.png';
        if (normalizedName === 'knight') return '/static/knight.png';
        if (normalizedName === 'monk') return '/static/monk.png';
        return '/static/boss.png';
    }

    function buildVoteChip(label, tone = 'neutral') {
        const chip = document.createElement('span');
        chip.className = `round-summary-chip ${tone}`.trim();
        chip.textContent = label;
        return chip;
    }

    function getActionDescription(avatar, action) {
        return actionDescriptions?.[avatar]?.[action] || 'Performs this avatar action.';
    }

    function buildRoundSummaryCard(avatarName, action, actionResult, voteDetail) {
        const card = document.createElement('div');
        card.className = 'round-summary-card';

        const icon = document.createElement('img');
        icon.className = 'round-summary-icon';
        icon.alt = `${avatarName} icon`;
        icon.src = getAvatarIconPath(avatarName);

        const body = document.createElement('div');
        body.className = 'round-summary-body';

        const header = document.createElement('div');
        header.className = 'round-summary-header';

        const name = document.createElement('div');
        name.className = 'round-summary-name';
        name.textContent = avatarName;

        const hp = document.createElement('div');
        hp.className = 'round-summary-hp';
        const avatarMaxHealth = state.gameState?.avatar_max_health || { Wizard: 25, Knight: 40, Monk: 35 };
        const maxHp = avatarMaxHealth[avatarName] ?? (avatarName === 'Wizard' ? 25 : avatarName === 'Knight' ? 40 : 35);
        const currentHp = state.gameState?.avatar_states?.[avatarName]?.hp ?? 0;
        hp.textContent = `${Math.max(0, currentHp)} / ${maxHp} HP`;

        header.appendChild(name);
        header.appendChild(hp);

        const line1 = document.createElement('div');
        line1.className = 'round-summary-line';
        line1.textContent = actionResult
            ? `${avatarName} used ${action}${actionResult.damage ? ` for ${actionResult.damage} damage` : ''}.`
            : `${avatarName} did not act this round.`;

        const line2 = document.createElement('div');
        line2.className = 'round-summary-line muted';
        if (voteDetail) {
            if (voteDetail.selection_reason === 'cooldown_override') {
                line2.textContent = 'Voted action was on cooldown, so the game picked a different legal action.';
            } else if (voteDetail.selection_reason === 'no_votes_random') {
                line2.textContent = 'No votes were recorded for this avatar, so a random action was chosen.';
            } else if (voteDetail.selection_reason === 'dead_avatar_skipped') {
                line2.textContent = 'This avatar is down and could not act this round.';
            }
        } else {
            line2.textContent = 'No vote details were available for this avatar.';
        }

        const chips = document.createElement('div');
        chips.className = 'round-summary-votes';
        const voteEntries = Object.entries(voteDetail?.votes || {});
        if (voteEntries.length > 0) {
            voteEntries.forEach(([voteAction, count]) => {
                chips.appendChild(buildVoteChip(`${voteAction} x${count}`, voteAction === action ? 'good' : 'neutral'));
            });
        } else {
            chips.appendChild(buildVoteChip('No votes', 'bad'));
        }

        body.appendChild(header);
        body.appendChild(line1);
        body.appendChild(line2);
        body.appendChild(chips);

        card.appendChild(icon);
        card.appendChild(body);
        return card;
    }

    function buildBossSummaryCard(roundResults) {
        const card = document.createElement('div');
        card.className = 'round-summary-card is-boss';

        const icon = document.createElement('img');
        icon.className = 'round-summary-icon';
        icon.alt = 'Boss icon';
        icon.src = '/static/boss.png';

        const body = document.createElement('div');
        body.className = 'round-summary-body';

        const header = document.createElement('div');
        header.className = 'round-summary-header';

        const name = document.createElement('div');
        name.className = 'round-summary-name';
        name.textContent = 'Jonah';

        const bossHp = state.gameState?.boss_state?.hp ?? state.gameState?.boss_hp ?? state.gameState?.boss_health ?? 300;
        const hp = document.createElement('div');
        hp.className = 'round-summary-hp';
        hp.textContent = `${Math.max(0, bossHp)} / 300 HP`;

        header.appendChild(name);
        header.appendChild(hp);

        const line1 = document.createElement('div');
        line1.className = 'round-summary-line';
        if (roundResults.game_over) {
            line1.textContent = roundResults.outcome === 'WIN' ? 'The boss was defeated.' : 'The team was defeated.';
        } else {
            line1.textContent = 'Boss and avatar health updated from the round.';
        }

        const chips = document.createElement('div');
        chips.className = 'round-summary-votes';
        (roundResults.boss_attacks || []).forEach(attack => {
            if (attack && attack.message) {
                chips.appendChild(buildVoteChip(attack.message, attack.damage > 0 ? 'bad' : 'neutral'));
            }
        });
        if (!chips.children.length) {
            chips.appendChild(buildVoteChip('No boss attack this round', 'neutral'));
        }

        body.appendChild(header);
        body.appendChild(line1);
        body.appendChild(chips);

        card.appendChild(icon);
        card.appendChild(body);
        return card;
    }

    function showView(isGameView) {
        document.getElementById('lobby-view').classList.toggle('hidden', isGameView);
        document.getElementById('game-view').classList.toggle('hidden', !isGameView);
    }

    function renderHealthCard(prefix, hp, maxHp, statusText) {
        const fill = document.getElementById(`${prefix}-hp-fill`);
        const note = document.getElementById(`${prefix}-status`);
        if (fill) {
            const maxValue = Math.max(Number(maxHp || 0), 1);
            const currentValue = Math.max(Number(hp || 0), 0);
            fill.style.width = `${Math.max(0, Math.min(100, (currentValue / maxValue) * 100))}%`;
        }
        if (note) {
            note.textContent = statusText;
        }
    }

    function renderGameState(gameState) {
        if (!gameState) return;
        state.gameState = gameState;
        state.action_cooldowns = gameState.action_cooldowns || {};

        const bossState = gameState.boss_state || {};
        const bossHp = Number(gameState.boss_hp ?? gameState.boss_health ?? bossState.hp ?? 300);
        const bossMax = 300;
        document.getElementById('status-boss').textContent = `Boss HP: ${Math.max(0, bossHp)} / ${bossMax}`;
        renderHealthCard('boss', bossHp, bossMax, `${Math.max(0, bossHp)} / ${bossMax}`);

        const avatarStates = gameState.avatar_states || {};
        const wizard = avatarStates.Wizard || { hp: 25, status: [] };
        const knight = avatarStates.Knight || { hp: 40, status: [] };
        const monk = avatarStates.Monk || { hp: 35, status: [] };
        renderHealthCard('wizard', wizard.hp, 25, `${Math.max(0, wizard.hp)} / 25${wizard.status && wizard.status.length ? ` • ${wizard.status.join(', ')}` : ''}`);
        renderHealthCard('knight', knight.hp, 40, `${Math.max(0, knight.hp)} / 40${knight.status && knight.status.length ? ` • ${knight.status.join(', ')}` : ''}`);
        renderHealthCard('monk', monk.hp, 35, `${Math.max(0, monk.hp)} / 35${monk.status && monk.status.length ? ` • ${monk.status.join(', ')}` : ''}`);

        const roundIndex = (state.question && typeof state.question.question_index === 'number') ? state.question.question_index + 1 : (state.loadedQuestionIndex == null ? 0 : state.loadedQuestionIndex + 1);
        document.getElementById('status-round').textContent = `Round ${roundIndex}`;
        document.getElementById('status-avatar').textContent = `Avatar: ${state.assignedAvatar || 'Unknown'}`;

        // Update countdown timer
        const currentPhase = gameState.current_phase || 'answer';
        const timerEl = document.getElementById('status-timer');
        
        // Debug: log the values we're receiving
        if (!window.timerDebugLogged) {
            console.log('Timer Debug - gameState keys:', Object.keys(gameState));
            console.log('Timer Debug - server_time:', gameState.server_time);
            console.log('Timer Debug - answer_phase_started_at:', gameState.answer_phase_started_at);
            console.log('Timer Debug - vote_phase_started_at:', gameState.vote_phase_started_at);
            console.log('Timer Debug - current_phase:', gameState.current_phase);
            console.log('Timer Debug - answer_timeout_seconds:', gameState.answer_timeout_seconds);
            console.log('Timer Debug - vote_timeout_seconds:', gameState.vote_timeout_seconds);
            window.timerDebugLogged = true;
        }
        
        if (gameState.server_time != null && gameState.answer_phase_started_at != null) {
            let timeRemaining = 0;
            
            if (currentPhase === 'answer') {
                const answerTimeout = gameState.answer_timeout_seconds || 60;
                const serverElapsed = gameState.server_time - gameState.answer_phase_started_at;
                timeRemaining = Math.max(0, Math.ceil(answerTimeout - serverElapsed));
                console.log(`ANSWER: timeout=${answerTimeout}, elapsed=${serverElapsed.toFixed(2)}, remaining=${timeRemaining}`);
            } else if (currentPhase === 'vote' && gameState.vote_phase_started_at != null) {
                const voteTimeout = gameState.vote_timeout_seconds || 30;
                const serverElapsed = gameState.server_time - gameState.vote_phase_started_at;
                timeRemaining = Math.max(0, Math.ceil(voteTimeout - serverElapsed));
                console.log(`VOTE: timeout=${voteTimeout}, elapsed=${serverElapsed.toFixed(2)}, remaining=${timeRemaining}`);
            }
            
            if (timerEl) {
                timerEl.textContent = `Time: ${timeRemaining}s`;
                if (timeRemaining <= 10) {
                    timerEl.style.color = '#ff4444';
                    timerEl.style.fontWeight = 'bold';
                } else {
                    timerEl.style.color = 'inherit';
                    timerEl.style.fontWeight = 'normal';
                }
            }
        } else {
            console.warn('Timer missing data - server_time:', gameState.server_time, 'answer_phase_started_at:', gameState.answer_phase_started_at);
            if (timerEl) {
                timerEl.textContent = 'Time: --s';
            }
        }

        if (gameState.game_over) {
            state.polling = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('game-over').textContent = 'Game over. Check the host screen for the final outcome.';
        }
    }

    function renderQuestion(questionPayload) {
        if (!questionPayload) return;
        state.question = questionPayload;
        state.loadedQuestionIndex = questionPayload.question_index;
        state.answeredCorrectly = false;
        state.voteSubmitted = false;
        state.roundHandled = false;
        setMessage('', '');

        document.getElementById('question-title').textContent = questionPayload.question;
        document.getElementById('question-meta').textContent = `Question ${questionPayload.question_index + 1} of ${questionPayload.total_questions}`;

        const answerGrid = document.getElementById('answer-grid');
        answerGrid.innerHTML = '';
        questionPayload.options.forEach((optionText, index) => {
            const button = document.createElement('button');
            button.className = 'tile-button';
            button.textContent = optionText;
            button.onclick = () => submitAnswer(index);
            answerGrid.appendChild(button);
        });

        document.getElementById('question-stage').classList.remove('hidden');
        document.getElementById('vote-stage').classList.add('hidden');
        document.getElementById('round-stage').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
    }

    function renderVoteActions() {
        const voteStage = document.getElementById('vote-stage');
        const voteGrid = document.getElementById('vote-grid');
        const avatar = state.assignedAvatar;
        const actions = avatarActions[avatar] || [];
        const cooldownAction = state.action_cooldowns && state.action_cooldowns[avatar];
        const avatarHp = Number(state.gameState?.avatar_states?.[avatar]?.hp ?? 0);

        if (avatarHp <= 0) {
            voteGrid.innerHTML = '';
            setMessage('Your avatar is down and cannot act this round.', 'bad');
            voteStage.classList.remove('hidden');
            return;
        }

        voteGrid.innerHTML = '';
        actions.forEach(action => {
            const button = document.createElement('button');
            button.className = 'tile-button';
            const isOnCooldown = action === cooldownAction;

            const actionName = document.createElement('span');
            actionName.className = 'vote-action-name';
            actionName.textContent = action;

            const actionDesc = document.createElement('span');
            actionDesc.className = 'vote-action-desc';
            actionDesc.textContent = getActionDescription(avatar, action);

            button.appendChild(actionName);
            button.appendChild(actionDesc);
            
            if (isOnCooldown) {
                button.disabled = true;
                button.title = `${action} is cooling down. Use another action.`;
                const cooldownNote = document.createElement('span');
                cooldownNote.className = 'vote-action-note';
                cooldownNote.textContent = 'Cooling down';
                button.appendChild(cooldownNote);
            } else {
                button.onclick = () => submitVote(action);
            }
            
            voteGrid.appendChild(button);
        });

        voteStage.classList.remove('hidden');
    }

    async function submitAnswer(optionIndex) {
        const buttons = Array.from(document.querySelectorAll('#answer-grid button'));
        buttons.forEach(button => button.disabled = true);
        setMessage('Checking answer...', '');

        try {
            const response = await fetch(`/game/${gameId}/answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_id: playerId, option_index: optionIndex }),
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Failed to submit answer');
            }

            state.answeredCorrectly = Boolean(data.correct);
            if (data.correct) {
                setMessage('Correct. You can vote for your avatar action.', 'good');
                renderVoteActions();
            } else {
                setMessage('Incorrect. Wait for the round to resolve.', 'bad');
                document.getElementById('vote-stage').classList.add('hidden');
            }
        } catch (error) {
            setMessage(error.message, 'bad');
            buttons.forEach(button => button.disabled = false);
        }
    }

    async function submitVote(action) {
        if (state.voteSubmitted) return;
        state.voteSubmitted = true;

        const buttons = Array.from(document.querySelectorAll('#vote-grid button'));
        buttons.forEach(button => button.disabled = true);
        setMessage(`Vote submitted: ${action}`, 'good');

        try {
            const response = await fetch(`/game/${gameId}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: playerId,
                    avatar: state.assignedAvatar,
                    action,
                }),
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Failed to submit vote');
            }
        } catch (error) {
            state.voteSubmitted = false;
            setMessage(error.message, 'bad');
            buttons.forEach(button => button.disabled = false);
        }
    }

    async function handleRoundResolution(roundResults) {
        if (!roundResults || state.roundHandled) return;
        state.roundHandled = true;

        document.getElementById('question-stage').classList.add('hidden');
        document.getElementById('vote-stage').classList.add('hidden');
        document.getElementById('round-stage').classList.remove('hidden');
        document.getElementById('round-results-title').textContent = roundResults.game_over
            ? (roundResults.outcome === 'WIN' ? 'Victory' : 'Defeat')
            : 'Round resolved';

        const subtitle = document.getElementById('round-results-subtitle');
        if (subtitle) {
            subtitle.textContent = roundResults.game_over
                ? (roundResults.outcome === 'WIN' ? 'The boss was defeated.' : 'The team ran out of health or questions.')
                : 'Here is what each avatar did this round.';
        }

        const summaryGrid = document.getElementById('round-summary-grid');
        if (summaryGrid) {
            summaryGrid.innerHTML = '';
            const voteDetails = roundResults.vote_details || {};
            const actionsByAvatar = {};
            (roundResults.actions || []).forEach(action => {
                if (action && action.avatar) {
                    actionsByAvatar[action.avatar] = action;
                }
            });

            ['Wizard', 'Knight', 'Monk'].forEach(avatarName => {
                summaryGrid.appendChild(
                    buildRoundSummaryCard(
                        avatarName,
                        actionsByAvatar[avatarName]?.action || 'No action',
                        actionsByAvatar[avatarName],
                        voteDetails[avatarName]
                    )
                );
            });

            summaryGrid.appendChild(buildBossSummaryCard(roundResults));
        }

        if (state.gameState) {
            renderGameState(state.gameState);
        }

        const roundSummaryDelayMs = 8000;

        window.setTimeout(async () => {
            try {
                const response = await fetch(`/game/${gameId}/next-question`);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to advance to the next question');
                }

                if (data.game_over) {
                    state.polling = false;
                    document.getElementById('game-over').classList.remove('hidden');
                    document.getElementById('game-over').textContent = data.outcome === 'WIN' ? 'Victory! The boss was defeated.' : 'Defeat. The team ran out of questions or avatars fell.';
                    return;
                }

                if (data.game_state) {
                    renderGameState(data.game_state);
                }
                if (data.question) {
                    renderQuestion(data.question);
                    document.getElementById('question-stage').classList.remove('hidden');
                }
            } catch (error) {
                setMessage(error.message, 'bad');
                state.roundHandled = false;
            }
        }, roundSummaryDelayMs);
    }

    async function loadCurrentQuestion() {
        try {
            const response = await fetch(`/game/${gameId}/question`);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Failed to load question');
            }

            if (data.game_state) {
                renderGameState(data.game_state);
            }
            if (data.question) {
                const nextIndex = data.question.question_index;
                if (state.loadedQuestionIndex !== nextIndex) {
                    renderQuestion(data.question);
                }
            }
        } catch (error) {
            setMessage(error.message, 'bad');
        }
    }

    async function pollPlayerStatus() {
        if (!state.polling) return;

        try {
            const response = await fetch(`/game/${gameId}/player/get-data/${playerId}`);
            const playerData = await response.json();
            if (!response.ok) {
                throw new Error(playerData.error || 'Failed to fetch player status');
            }

            state.player = playerData;
            state.assignedAvatar = playerData.assigned_avatar || state.assignedAvatar;
            document.getElementById('status-player').textContent = `Player: ${playerData.name || 'Unknown'}`;
            document.getElementById('welcome-name').textContent = `Welcome, ${playerData.name || 'player'}.`;
            document.getElementById('welcome-avatar').textContent = `Avatar: ${state.assignedAvatar || 'Pending'}`;

            if (playerData.player_status === 'kicked') {
                alert('You have been removed from the game by the host.');
                window.location.href = '/';
                return;
            }

            if (playerData.player_status === 'lobby') {
                showView(false);
                return;
            }

            showView(true);
            await loadCurrentQuestion();

            const stateResponse = await fetch(`/game/state/${gameId}`);
            const gameState = await stateResponse.json();
            if (stateResponse.ok) {
                renderGameState(gameState);
                if (gameState.round_results && !state.roundHandled) {
                    await handleRoundResolution(gameState.round_results);
                }
            }
        } catch (error) {
            console.error('Error fetching player/game state:', error);
        }
    }

    pollPlayerStatus();
    setInterval(pollPlayerStatus, 1000);
</script>
